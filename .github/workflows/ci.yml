name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -v quiet

      - name: Test
        run: dotnet test --no-build -v quiet
        # Tests use Testcontainers — Docker daemon is available on ubuntu-latest runners.

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build

  smoke:
    name: Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start stack
        run: docker compose up -d

      - name: Wait for API to be healthy
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:5100/health && echo " ✓ healthy" && break
            echo "Waiting for API... ($i/30)"
            sleep 3
          done

      - name: Run smoke test
        run: ./scripts/smoke-test.sh

      - name: Stop stack
        if: always()
        run: docker compose down
